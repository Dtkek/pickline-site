<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickline — вход в TikTok</title>
<style>
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0c0d11; color: #f5f6f8; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; line-height: 1.6; }
  code { display: block; word-break: break-all; background: #1a1c22; padding: 16px; border-radius: 8px; font-size: 15px; }
  button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 8px; background: #f7931e; color: #0e0e10;
           font-weight: 700; font-size: 16px; cursor: pointer; }
  .muted { color: #969ca8; }
</style>
</head>
<body>
<main>
  <h1>Вход в TikTok</h1>
  <p id="msg" class="muted">Читаю ответ TikTok…</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Скопировать</button>
</main>
<script>
  // Страница только показывает код из адресной строки - никуда его не отправляет.
  const p = new URLSearchParams(location.search);
  const msg = document.getElementById("msg");
  if (p.get("code")) {
    msg.textContent = "Готово. Скопируйте код и пришлите его Claude — код действует несколько минут.";
    const c = document.getElementById("code");
    c.textContent = p.get("code");
    c.hidden = false;
    const b = document.getElementById("copy");
    b.hidden = false;
    b.onclick = () => navigator.clipboard.writeText(p.get("code")).then(() => (b.textContent = "Скопировано"));
  } else if (p.get("error")) {
    msg.textContent = "TikTok вернул ошибку: " + p.get("error") + " " + (p.get("error_description") || "");
  } else {
    msg.textContent = "Кода в адресе нет. Эта страница открывается после входа в TikTok.";
  }
</script>
</body>
</html>
